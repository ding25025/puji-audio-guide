<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#f8f6f1">
<script>
  try{
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    if (localStorage.getItem('big') === '1') document.documentElement.classList.add('big');
  }catch(e){}
</script>
<title>小護法養成記</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="小護法養成記">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="普濟精舍　護博會展覽《小護法養成記》語音導覽，開場、五大核心與四個展區的語音與逐字稿。">
<style>
  :root{
    --bg:#f8f6f1; --card:#fff; --fg:#211f1a; --muted:#6f6a5e;
    --accent:#8a6a2f; --accent-fg:#fff; --track:#e6e1d6; --line:#e8e3d8;
  }
  /* 深色：跟隨系統，但 data-theme 指定時以它為準 */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#17161a; --card:#201f24; --fg:#f1efe9; --muted:#9d988c;
      --accent:#c9a25a; --accent-fg:#1b1a17; --track:#35333b; --line:#2d2b33;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17161a; --card:#201f24; --fg:#f1efe9; --muted:#9d988c;
    --accent:#c9a25a; --accent-fg:#1b1a17; --track:#35333b; --line:#2d2b33;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; font-size:16px}
  html.big{font-size:19.5px}          /* 「大字」開關 */
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
    font:1.0625rem/1.8 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
  }
  header{text-align:center; margin:2px 0 16px; max-width:460px}
  h1{font-size:1.3rem; font-weight:600; margin:0 0 4px; letter-spacing:.02em}
  header .sub{margin:0; color:var(--muted); font-size:.82rem; letter-spacing:.03em}

  .tools{width:100%; max-width:460px; display:flex; justify-content:flex-end; gap:8px; margin:-6px 0 8px}
  .tool{
    display:inline-flex; align-items:center; gap:5px;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    border-radius:99px; padding:5px 12px; font-size:.78rem; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tool svg{width:15px; height:15px; flex:0 0 auto}
  .tool .lb{min-width:2.4em; text-align:center}
  .tool[aria-pressed="true"]{
    background:color-mix(in srgb,var(--accent) 14%,transparent);
    border-color:color-mix(in srgb,var(--accent) 50%,transparent); color:var(--fg);
  }

  ul{list-style:none; padding:0; margin:0; width:100%; max-width:460px;
     display:flex; flex-direction:column; gap:10px}
  li{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 12px 12px; transition:border-color .2s ease;
  }
  li.active{border-color:var(--accent)}
  li.target{animation:pop 1.3s ease}
  @keyframes pop{0%,45%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}100%{box-shadow:none}}

  .row{display:flex; align-items:center; gap:8px}
  button{font:inherit; color:inherit}

  /* 播放／暫停 */
  .ctrl{flex:0 0 auto; display:flex; align-items:center}
  button.p{
    flex:0 0 auto; width:44px; height:44px; border-radius:50%; border:0; padding:0;
    background:var(--accent); color:var(--accent-fg); cursor:pointer;
    display:grid; place-items:center; transition:transform .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button.p:active{transform:scale(.92)}
  button.p svg{width:18px; height:18px; fill:currentColor}

  /* 前後跳轉 10 秒 */
  button.s{
    position:relative; flex:0 0 auto; width:32px; height:40px; border:0; padding:0;
    background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center;
    transition:transform .12s ease, color .2s ease; -webkit-tap-highlight-color:transparent;
  }
  button.s::after{content:''; position:absolute; inset:-2px -4px}   /* 把可按範圍撐大 */
  button.s:active{transform:scale(.88)}
  li.active button.s{color:var(--fg)}
  button.s svg{width:20px; height:20px; fill:currentColor}
  button.s text{font-family:inherit}

  /* 標題整塊都可以按，用來展開逐字稿 */
  .exp{
    flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
    background:none; border:0; margin:0; padding:2px 0 2px 4px; text-align:start;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .exp:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px}
  .t{flex:1 1 auto; min-width:0; font-weight:600; font-size:1rem; line-height:1.35; letter-spacing:.02em}
  .t small{display:block; margin-top:1px; font-weight:400; font-size:.72rem;
           color:var(--muted); letter-spacing:.06em}
  .d{flex:0 0 auto; min-width:3.1em; text-align:right;
     font-variant-numeric:tabular-nums; font-size:.76rem; color:var(--muted)}
  .doc{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:3px; white-space:nowrap;
    padding:4px 8px 4px 11px; border:1px solid var(--line); border-radius:99px;
    font-size:.75rem; line-height:1.25; color:var(--muted);
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .doc .lb{display:inline-block; min-width:3.2em; text-align:center}
  li.open .doc{
    background:color-mix(in srgb,var(--accent) 14%,transparent);
    border-color:color-mix(in srgb,var(--accent) 50%,transparent); color:var(--fg);
  }
  .chev{flex:0 0 auto; width:14px; height:14px; fill:currentColor; transition:transform .3s ease}
  li.open .chev{transform:rotate(180deg)}

  .prog{display:flex; align-items:center; gap:9px; margin-top:6px}
  .seek{flex:1 1 auto; height:18px; display:flex; align-items:center; cursor:pointer;
        touch-action:none; -webkit-tap-highlight-color:transparent}
  .seek:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
  .bar{flex:1 1 auto; height:4px; border-radius:99px; background:var(--track);
       overflow:hidden; transition:height .12s ease}
  .seek.drag .bar{height:6px}
  .bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px}

  /* 逐字稿：預設收合，按下標題或開始播放才展開 */
  .body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease}
  .body > div{overflow:hidden; min-height:0}
  li.open .body{grid-template-rows:1fr}
  .body p{margin:0 0 .75em; font-size:.95rem; line-height:1.85}
  .body p:first-child{margin-top:12px}
  .body p:last-child{margin-bottom:0}

  footer{margin-top:20px; color:var(--muted); font-size:.78rem; text-align:center}

  /* 矮螢幕再收緊一點，讓卡片不要拉得太長 */
  @media (max-height:680px){
    body{padding-top:12px}
    header{margin-bottom:10px}
    h1{font-size:1.16rem}
    header .sub{font-size:.76rem}
    ul{gap:8px}
    li{padding:8px 12px 10px}
    footer{margin-top:14px}
  }
  @media (prefers-contrast:more){
    :root{--muted:#4a463c; --line:#a9a291}
    @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--muted:#d3cdbf; --line:#615c4e} }
    :root[data-theme="dark"]{--muted:#d3cdbf; --line:#615c4e}
    li{border-width:2px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important; animation-duration:.01ms !important}
  }
</style>
</head>
<body>

<header>
  <h1>小護法養成記</h1>
  <p class="sub">普濟精舍　護博會展覽　語音導覽</p>
</header>

<div class="tools">
  <button class="tool" id="theme"></button>
  <button class="tool" id="bigger" aria-pressed="false"><span class="lb">大字</span></button>
</div>

<ul id="list"></ul>

<footer>阿彌陀佛　感謝您的聆聽</footer>

<script>
/* ─── 內容在這裡改 ───────────────────────────── */
const TRACKS = [
  { id:'a1', title:'開場與調研', label:'導覽開始', src:'audio1.mp3', text:
`歡迎來到普濟精舍《小護法養成記》的攤位。

普濟精舍成立已經三十四年了。您可能不知道，精舍有一群孩子從小在這裡長大，現在都已經能獨當一面，甚至在山上承擔重要的執事。

說到這裡，您可能會好奇：年輕人要學佛多不容易啊，究竟精舍做了什麼，能讓這群年輕人願意一直留下來？

為了找出答案，我們特別做了一份「佛化家庭」調研。展板上的數據顯示，普濟目前有一百六十四戶佛化家庭，總人數高達四百一十人。其中以「二代家庭」的八十二戶為最高，這正是精舍兒童與青年的主要來源，而最大的家族甚至有十個人。這證實了，佛化家庭成為精舍最穩定的基礎。` },

  { id:'a2', title:'五大核心', label:'養成心法', src:'audio2.mp3', text:
`那麼，精舍到底是怎麼護念這群孩子的呢？秘密就在這裡，「小護法養成的五大核心」。

第一，是豐富多元的學習內容。第二，是溫暖的環境氛圍。第三，是有興趣的執事內容。第四，是熟悉的同參道友。第五，也是最重要的，就是有學習的楷模。

這五大核心的目的，都是在闡揚覺的教育。

運用這五個核心，我們把青年的成長歷程，歸納成「啟蒙」、「歷練」、「叛逆」和「成長」四個階段。接下來每一個階段的展板上方，都可以看到這五個核心的光譜有不同比重的呈現。` },

  { id:'a3', title:'啟蒙區', label:'第一站', src:'audio3.mp3', text:
`歡迎來到《小護法養成記》的第一站，啟蒙區。

在孩子心中，精舍是個安全又好玩的地方。剛接觸精舍的時候，我們用豐富多元的學習內容，還有溫暖的環境氛圍來引導他們。

除了固定的禪修班，在節慶的時候，我們還會舉辦兒童生日法會、大專密室逃脫等等的活動，讓孩子覺得精舍好酷、好想來。這正是佛法「先以欲鉤牽，後令入佛智」的慈悲智慧。

展板上留著孩子們的回饋，這些心聲，就是精舍給他們最真實的感受。` },

  { id:'a4', title:'歷練區', label:'第二站', src:'audio4.mp3', text:
`這裡是第二站，歷練區。

隨著孩子慢慢長大，光是好玩已經不夠了，他們開始渴望被認同。

這時候，精舍給他們有興趣的執事，還有同儕的陪伴，開啟了心燈、梵唄、司儀等等的發心平台。我們用「信任與容錯」的道風，給孩子們領執事、修善法的機會。

展板上這兩則漫畫，可不是捏造的，而是他們在錯誤中成長的真實故事。我們還把它做成了一本漫畫書，歡迎您到漫畫區自由翻閱。` },

  { id:'a5', title:'叛逆區', label:'第三站', src:'audio5.mp3', text:
`這裡是第三站，叛逆區。

「別再問了，我沒有要去啦！」這句話，家裡有青少年的人，聽起來是不是特別熟悉？

到了青年期，面對課業或是人際挫折，孩子常常會不想來精舍。這時候，精舍的法寶就是溫暖與陪伴。不勉強、不放棄，靜心等候下一個因緣。父母的堅持，正是護念青年在精舍成長最堅強的力量。

這一區有一座「時光電話亭」，護念導航讓您不迷航，只要拿起電話，就能聽到護念者分享護念心法的九大招。

旁邊還有「煩惱法門對對碰」，這些問題都是青年最常遇到的煩惱，歡迎您動手翻開答案，看看老和尚教我們怎麼用智慧解題。` },

  { id:'a6', title:'成長區', label:'第四站', src:'audio6.mp3', text:
`這裡是最後一站，成長區。

度過了叛逆期的風雨，孩子終於成熟了。

調研中我們注意到，很多青年在社會歷練一圈之後，回過頭才明白：原來，精舍才是最溫暖的家。因為感恩，他們從「被護念的人」，轉變成「想護念他人」的人。

展板上這張善循環圖：精舍用五大核心培養青年，讓佛法紮根；青年透過學佛和承擔執事來修養品格，進而護持道場、擴展視野。這就是一個從「被護念者」到「護念他人」的善循環。

在住持法師的帶領下，護念者以身作則，成為青年最好的榜樣。這種典範的力量，正是青年願意全心護持的核心關鍵。

佛法傳承需要向下扎根，小護法的養成，要一代接一代。護念一顆菩提種子，就能成就未來護法因緣。

感謝您的聆聽，阿彌陀佛。` },
];
/* ──────────────────────────────────────────── */

const PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';
const ROUND='M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z';
const CHEV='M7 10l5 5 5-5z';
const SKIP = 10;   // 前後跳轉的秒數

const skipIcon = back =>
  `<svg viewBox="0 0 24 24" aria-hidden="true">` +
  `<path${back ? '' : ' transform="translate(24,0) scale(-1,1)"'} d="${ROUND}"/>` +
  `<text x="12" y="16.5" text-anchor="middle" font-size="8" font-weight="700">${SKIP}</text></svg>`;

const fmt = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '–:––';
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const paras = s => esc(s).trim().split(/\n\s*\n/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');

const list = document.getElementById('list');
let current = null;

// 一次只展開一段，卡片才不會被逐字稿撐開到看不見別站
const setOpen = (li, on) => {
  li.classList.toggle('open', on);
  li.querySelector('.exp').setAttribute('aria-expanded', on ? 'true' : 'false');
  li.querySelector('.doc .lb').textContent = on ? '收合' : '逐字稿';
  if (!on) return;
  list.querySelectorAll('li.open').forEach(o => { if (o !== li) setOpen(o, false); });
  setTimeout(() => li.scrollIntoView({behavior:'smooth', block:'nearest'}), 320);
};

TRACKS.forEach(t => {
  const li = document.createElement('li');
  li.id = t.id;
  li.innerHTML =
    `<div class="row">
       <div class="ctrl">
         <button class="s b" aria-label="倒退 ${SKIP} 秒">${skipIcon(true)}</button>
         <button class="p" aria-label="播放 ${esc(t.title)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${PLAY}"/></svg></button>
         <button class="s f" aria-label="前進 ${SKIP} 秒">${skipIcon(false)}</button>
       </div>
       <button class="exp" aria-expanded="false" aria-controls="${t.id}-text">
         <span class="t">${esc(t.title)}<small>${esc(t.label)}</small></span>
         <span class="doc"><span class="lb">逐字稿</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="${CHEV}"/></svg></span>
       </button>
     </div>
     <div class="prog">
       <div class="seek" role="slider" tabindex="0" aria-label="${esc(t.title)}播放進度"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="尚未播放"><div class="bar"><i></i></div></div>
       <span class="d">–:––</span>
     </div>
     <div class="body" id="${t.id}-text"><div>${paras(t.text)}</div></div>`;

  const audio = new Audio(t.src);
  audio.preload = 'metadata';
  audio.playsInline = true;

  const btn  = li.querySelector('button.p');
  const path = li.querySelector('button.p path');
  const exp  = li.querySelector('.exp');
  const seek = li.querySelector('.seek');
  const bar  = li.querySelector('.bar');
  const fill = li.querySelector('.bar i');
  const dur  = li.querySelector('.d');

  const ready = () => isFinite(audio.duration) && audio.duration > 0;

  // 依指定秒數畫出進度條與剩餘時間
  const draw = t => {
    const r = ready() ? t / audio.duration : 0;
    fill.style.width = (r * 100) + '%';
    dur.textContent = ready() ? fmt(audio.duration - t) : '–:––';
    seek.setAttribute('aria-valuenow', Math.round(r * 100));
    seek.setAttribute('aria-valuetext', ready() ? `${fmt(t)}，全長 ${fmt(audio.duration)}` : '尚未播放');
  };

  const jump = sec => {
    if (!ready()) return;
    audio.currentTime = Math.min(audio.duration - .05, Math.max(0, audio.currentTime + sec));
  };

  btn.onclick = () => {
    if (audio.paused) {
      if (current && current !== audio) current.pause();
      current = audio;
      audio.play();
    } else audio.pause();
  };
  li.querySelector('button.b').onclick = () => jump(-SKIP);
  li.querySelector('button.f').onclick = () => jump(SKIP);
  exp.onclick = () => setOpen(li, !li.classList.contains('open'));

  // 進度條：點一下跳到該處，按著也可以直接拖
  const ratioAt = e => {
    const r = bar.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };
  let dragging = false;
  seek.addEventListener('pointerdown', e => {
    if (!ready()) return;
    dragging = true;
    seek.classList.add('drag');
    seek.setPointerCapture(e.pointerId);
    draw(ratioAt(e) * audio.duration);          // 拖的時候只動畫面，放開才真的跳
  });
  seek.addEventListener('pointermove', e => { if (dragging) draw(ratioAt(e) * audio.duration); });
  seek.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    seek.classList.remove('drag');
    audio.currentTime = ratioAt(e) * audio.duration;
  });
  seek.addEventListener('pointercancel', () => {
    dragging = false; seek.classList.remove('drag'); draw(audio.currentTime);
  });
  seek.addEventListener('keydown', e => {          // 鍵盤左右鍵微調
    const step = {ArrowLeft:-5, ArrowDown:-5, ArrowRight:5, ArrowUp:5}[e.key];
    if (step === undefined) return;
    e.preventDefault();
    jump(step);
  });

  audio.onplay  = () => {
    path.setAttribute('d',PAUSE); li.classList.add('active');
    btn.setAttribute('aria-label', `暫停 ${t.title}`);
    setOpen(li, true);
  };
  audio.onpause = () => {
    path.setAttribute('d',PLAY); li.classList.remove('active');
    btn.setAttribute('aria-label', `播放 ${t.title}`);
  };
  audio.onended = () => { audio.currentTime = 0; draw(0); };
  audio.onloadedmetadata = () => { draw(0); };
  audio.ontimeupdate = () => { if (!dragging) draw(audio.currentTime); };

  list.appendChild(li);
});

// 深色／淺色切換：預設跟著系統走，按了就以手動選擇為準（記在這支手機上）
const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
  <circle cx="12" cy="12" r="4.2"/>
  <path d="M12 2.6v2.1M12 19.3v2.1M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"/>
</svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <path d="M20.7 14.7A8.6 8.6 0 0 1 9.3 3.3a8.6 8.6 0 1 0 11.4 11.4z"/>
</svg>`;
const root = document.documentElement;
const themeBtn = document.getElementById('theme');
const sysDark = window.matchMedia
  ? matchMedia('(prefers-color-scheme:dark)')
  : { matches:false, addEventListener(){} };      // 舊瀏覽器沒有 matchMedia 時的退路
const isDark = () => {
  const set = root.getAttribute('data-theme');
  return set ? set === 'dark' : sysDark.matches;
};
const paintTheme = () => {
  const dark = isDark();
  themeBtn.innerHTML = (dark ? SUN : MOON) + `<span class="lb">${dark ? '淺色' : '深色'}</span>`;
  themeBtn.setAttribute('aria-label', dark ? '切換成淺色模式' : '切換成深色模式');
  document.getElementById('tc').content = dark ? '#17161a' : '#f8f6f1';
};
themeBtn.onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  paintTheme();
};
sysDark.addEventListener('change', paintTheme);
paintTheme();

// 大字開關：放大整頁字級，選擇會記在這支手機上
const bigger = document.getElementById('bigger');
const setBig = (on, save) => {
  root.classList.toggle('big', on);
  bigger.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (save) { try { localStorage.setItem('big', on ? '1' : '0'); } catch (e) {} }
};
bigger.onclick = () => setBig(!root.classList.contains('big'), true);
setBig(root.classList.contains('big'), false);   // head 裡已先套用，這裡只補上按鈕狀態

// 網址帶 #a5 之類時，展開該區並標示（iOS 不允許自動播放，仍需點一下）
const hash = location.hash.slice(1);
if (hash) {
  const el = document.getElementById(hash);
  if (el) { setOpen(el, true); el.scrollIntoView({block:'center'}); el.classList.add('target'); }
}
</script>
</body>
</html>
