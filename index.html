<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#17161a" media="(prefers-color-scheme:dark)">
<title>小護法養成記</title>
<style>
  :root{
    --bg:#f8f6f1; --card:#fff; --fg:#211f1a; --muted:#6f6a5e;
    --accent:#8a6a2f; --accent-fg:#fff; --track:#e6e1d6; --line:#e8e3d8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#17161a; --card:#201f24; --fg:#f1efe9; --muted:#9d988c;
           --accent:#c9a25a; --accent-fg:#1b1a17; --track:#35333b; --line:#2d2b33; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
    font:17px/1.8 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
  }
  header{text-align:center; margin:2px 0 16px; max-width:460px}
  h1{font-size:1.3rem; font-weight:600; margin:0 0 4px; letter-spacing:.02em}
  header .sub{margin:0; color:var(--muted); font-size:.82rem; letter-spacing:.03em}

  ul{list-style:none; padding:0; margin:0; width:100%; max-width:460px;
     display:flex; flex-direction:column; gap:10px}
  li{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 12px 12px; transition:border-color .2s ease;
  }
  li.active{border-color:var(--accent)}
  li.target{animation:pop 1.3s ease}
  @keyframes pop{0%,45%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}100%{box-shadow:none}}

  .row{display:flex; align-items:center; gap:8px}
  button{font:inherit; color:inherit}

  /* 播放／暫停 */
  .ctrl{flex:0 0 auto; display:flex; align-items:center}
  button.p{
    flex:0 0 auto; width:44px; height:44px; border-radius:50%; border:0; padding:0;
    background:var(--accent); color:var(--accent-fg); cursor:pointer;
    display:grid; place-items:center; transition:transform .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button.p:active{transform:scale(.92)}
  button.p svg{width:18px; height:18px; fill:currentColor}

  /* 前後跳轉 10 秒 */
  button.s{
    flex:0 0 auto; width:32px; height:40px; border:0; padding:0; background:transparent;
    color:var(--muted); cursor:pointer; display:grid; place-items:center;
    transition:transform .12s ease, color .2s ease; -webkit-tap-highlight-color:transparent;
  }
  button.s:active{transform:scale(.88)}
  li.active button.s{color:var(--fg)}
  button.s svg{width:20px; height:20px; fill:currentColor}
  button.s text{font-family:inherit}

  /* 標題整塊都可以按，用來展開逐字稿 */
  .exp{
    flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
    background:none; border:0; margin:0; padding:2px 0 2px 4px; text-align:start;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .exp:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px}
  .t{flex:1 1 auto; min-width:0; font-weight:600; font-size:1rem; line-height:1.35; letter-spacing:.02em}
  .t small{display:block; margin-top:1px; font-weight:400; font-size:.72rem;
           color:var(--muted); letter-spacing:.06em}
  .d{flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:.8rem; color:var(--muted)}
  .chev{flex:0 0 auto; width:16px; height:16px; fill:var(--muted); transition:transform .3s ease}
  li.open .chev{transform:rotate(180deg)}

  .seek{margin-top:6px; height:18px; display:flex; align-items:center; cursor:pointer;
        touch-action:none; -webkit-tap-highlight-color:transparent}
  .seek:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
  .bar{flex:1 1 auto; height:4px; border-radius:99px; background:var(--track);
       overflow:hidden; transition:height .12s ease}
  .seek.drag .bar{height:6px}
  .bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px}

  /* 逐字稿：預設收合，按下標題或開始播放才展開 */
  .body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease}
  .body > div{overflow:hidden; min-height:0; padding-top:12px}
  li.open .body{grid-template-rows:1fr}
  .body p{margin:0 0 .75em; font-size:.95rem; line-height:1.85}
  .body p:last-child{margin-bottom:0}

  footer{margin-top:20px; color:var(--muted); font-size:.78rem; text-align:center}

  /* 矮螢幕再收緊一點，讓四站維持在一畫面內 */
  @media (max-height:680px){
    body{padding-top:12px}
    header{margin-bottom:10px}
    h1{font-size:1.16rem}
    header .sub{font-size:.76rem}
    ul{gap:8px}
    li{padding:8px 12px 10px}
    footer{margin-top:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important; animation-duration:.01ms !important}
  }
</style>
</head>
<body>

<header>
  <h1>小護法養成記</h1>
  <p class="sub">普濟精舍　護博會展覽　語音導覽</p>
</header>

<ul id="list"></ul>

<footer>阿彌陀佛　感謝您的聆聽</footer>

<script>
/* ─── 內容在這裡改 ───────────────────────────── */
const TRACKS = [
  { id:'a1', title:'啟蒙區', label:'第一站', src:'audio1.mp3', text:
`歡迎來到《小護法養成記》的第一站，啟蒙區。

在孩子心中，精舍是個安全又好玩的地方。剛接觸精舍的時候，我們用豐富多元的學習內容，還有溫暖的環境氛圍來引導他們。

除了固定的禪修班，在節慶的時候，我們還會舉辦兒童生日法會、大專密室逃脫等等的活動，讓孩子覺得精舍好酷、好想來。這正是佛法「先以欲鉤牽，後令入佛智」的慈悲智慧。

展板上留著孩子們的回饋，這些心聲，就是精舍給他們最真實的感受。` },

  { id:'a2', title:'歷練區', label:'第二站', src:'audio2.mp3', text:
`這裡是第二站，歷練區。

隨著孩子慢慢長大，光是好玩已經不夠了，他們開始渴望被認同。

這時候，精舍給他們有興趣的執事，還有同儕的陪伴，開啟了心燈、梵唄、司儀等等的發心平台。我們用「信任與容錯」的道風，給孩子們領執事、修善法的機會。

展板上這兩則漫畫，可不是捏造的，而是他們在錯誤中成長的真實故事。我們還把它做成了一本漫畫書，歡迎您到漫畫區自由翻閱。` },

  { id:'a3', title:'叛逆區', label:'第三站', src:'audio3.mp3', text:
`這裡是第三站，叛逆區。

「別再問了，我沒有要去啦！」這句話，家裡有青少年的人，聽起來是不是特別熟悉？

到了青年期，面對課業或是人際挫折，孩子常常會不想來精舍。這時候，精舍的法寶就是溫暖與陪伴。不勉強、不放棄，靜心等候下一個因緣。父母的堅持，正是護念青年在精舍成長最堅強的力量。

這一區有一座「時光電話亭」，護念導航讓您不迷航，只要拿起電話，就能聽到護念者分享護念心法的九大招。

旁邊還有「煩惱法門對對碰」，這些問題都是青年最常遇到的煩惱，歡迎您動手翻開答案，看看老和尚教我們怎麼用智慧解題。` },

  { id:'a4', title:'成長區', label:'第四站', src:'audio4.mp3', text:
`這裡是最後一站，成長區。

度過了叛逆期的風雨，孩子終於成熟了。

調研中我們注意到，很多青年在社會歷練一圈之後，回過頭才明白：原來，精舍才是最溫暖的家。因為感恩，他們從「被護念的人」，轉變成「想護念他人」的人。

展板上這張善循環圖：精舍用五大核心培養青年，讓佛法紮根；青年透過學佛和承擔執事來修養品格，進而護持道場、擴展視野。這就是一個從「被護念者」到「護念他人」的善循環。

在住持法師的帶領下，護念者以身作則，成為青年最好的榜樣。這種典範的力量，正是青年願意全心護持的核心關鍵。

佛法傳承需要向下扎根，小護法的養成，要一代接一代。護念一顆菩提種子，就能成就未來護法因緣。

感謝您的聆聽，阿彌陀佛。` },
];
/* ──────────────────────────────────────────── */

const PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';
const ROUND='M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z';
const CHEV='M7 10l5 5 5-5z';
const SKIP = 10;   // 前後跳轉的秒數

const skipIcon = back =>
  `<svg viewBox="0 0 24 24" aria-hidden="true">` +
  `<path${back ? '' : ' transform="translate(24,0) scale(-1,1)"'} d="${ROUND}"/>` +
  `<text x="12" y="16.5" text-anchor="middle" font-size="8" font-weight="700">${SKIP}</text></svg>`;

const fmt = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '–:––';
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const paras = s => esc(s).trim().split(/\n\s*\n/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');

const list = document.getElementById('list');
let current = null;

// 一次只展開一段，四張卡片才留得住在同一畫面
const setOpen = (li, on) => {
  li.classList.toggle('open', on);
  li.querySelector('.exp').setAttribute('aria-expanded', on ? 'true' : 'false');
  if (!on) return;
  list.querySelectorAll('li.open').forEach(o => { if (o !== li) setOpen(o, false); });
  setTimeout(() => li.scrollIntoView({behavior:'smooth', block:'nearest'}), 320);
};

TRACKS.forEach(t => {
  const li = document.createElement('li');
  li.id = t.id;
  li.innerHTML =
    `<div class="row">
       <div class="ctrl">
         <button class="s b" aria-label="倒退 ${SKIP} 秒">${skipIcon(true)}</button>
         <button class="p" aria-label="播放 ${esc(t.title)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${PLAY}"/></svg></button>
         <button class="s f" aria-label="前進 ${SKIP} 秒">${skipIcon(false)}</button>
       </div>
       <button class="exp" aria-expanded="false" aria-controls="${t.id}-text">
         <span class="t">${esc(t.title)}<small>${esc(t.label)}</small></span>
         <span class="d">–:––</span>
         <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="${CHEV}"/></svg>
       </button>
     </div>
     <div class="seek" role="slider" tabindex="0" aria-label="${esc(t.title)}播放進度"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"><i></i></div></div>
     <div class="body" id="${t.id}-text"><div>${paras(t.text)}</div></div>`;

  const audio = new Audio(t.src);
  audio.preload = 'metadata';
  audio.playsInline = true;

  const btn  = li.querySelector('button.p');
  const path = li.querySelector('button.p path');
  const exp  = li.querySelector('.exp');
  const seek = li.querySelector('.seek');
  const bar  = li.querySelector('.bar');
  const fill = li.querySelector('.bar i');
  const dur  = li.querySelector('.d');

  const ready = () => isFinite(audio.duration) && audio.duration > 0;

  // 依指定秒數畫出進度條與剩餘時間
  const draw = t => {
    const r = ready() ? t / audio.duration : 0;
    fill.style.width = (r * 100) + '%';
    dur.textContent = ready() ? fmt(audio.duration - t) : '–:––';
    seek.setAttribute('aria-valuenow', Math.round(r * 100));
  };

  const jump = sec => {
    if (!ready()) return;
    audio.currentTime = Math.min(audio.duration - .05, Math.max(0, audio.currentTime + sec));
  };

  btn.onclick = () => {
    if (audio.paused) {
      if (current && current !== audio) current.pause();
      current = audio;
      audio.play();
    } else audio.pause();
  };
  li.querySelector('button.b').onclick = () => jump(-SKIP);
  li.querySelector('button.f').onclick = () => jump(SKIP);
  exp.onclick = () => setOpen(li, !li.classList.contains('open'));

  // 進度條：點一下跳到該處，按著也可以直接拖
  const ratioAt = e => {
    const r = bar.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };
  let dragging = false;
  seek.addEventListener('pointerdown', e => {
    if (!ready()) return;
    dragging = true;
    seek.classList.add('drag');
    seek.setPointerCapture(e.pointerId);
    draw(ratioAt(e) * audio.duration);          // 拖的時候只動畫面，放開才真的跳
  });
  seek.addEventListener('pointermove', e => { if (dragging) draw(ratioAt(e) * audio.duration); });
  seek.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    seek.classList.remove('drag');
    audio.currentTime = ratioAt(e) * audio.duration;
  });
  seek.addEventListener('pointercancel', () => {
    dragging = false; seek.classList.remove('drag'); draw(audio.currentTime);
  });
  seek.addEventListener('keydown', e => {          // 鍵盤左右鍵微調
    const step = {ArrowLeft:-5, ArrowDown:-5, ArrowRight:5, ArrowUp:5}[e.key];
    if (step === undefined) return;
    e.preventDefault();
    jump(step);
  });

  audio.onplay  = () => { path.setAttribute('d',PAUSE); li.classList.add('active'); setOpen(li, true); };
  audio.onpause = () => { path.setAttribute('d',PLAY);  li.classList.remove('active'); };
  audio.onended = () => { audio.currentTime = 0; draw(0); };
  audio.onloadedmetadata = () => { draw(0); };
  audio.ontimeupdate = () => { if (!dragging) draw(audio.currentTime); };

  list.appendChild(li);
});

// 網址帶 #a3 之類時，展開該區並標示（iOS 不允許自動播放，仍需點一下）
const hash = location.hash.slice(1);
if (hash) {
  const el = document.getElementById(hash);
  if (el) { setOpen(el, true); el.scrollIntoView({block:'center'}); el.classList.add('target'); }
}
</script>
</body>
</html>
